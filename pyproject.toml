[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "turkish-knowledge-qa"
version = "0.1.0"
description = "Turkish source-grounded Knowledge QA API scaffold"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2,<1",
    "chromadb>=1,<2",
    "openai>=1,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "PyMuPDF>=1.24,<2",
    "PyYAML>=6,<7",
    "sentence-transformers>=3,<6",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "httpx2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
